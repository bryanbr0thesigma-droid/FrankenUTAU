<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flower In A Hurricane MV</title>
<link rel="stylesheet" href="./node_modules/@fontsource/m-plus-rounded-1c/500.css">
<link rel="stylesheet" href="./node_modules/@fontsource/m-plus-rounded-1c/700.css">
<link rel="stylesheet" href="./node_modules/@fontsource/m-plus-rounded-1c/800.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font: 14px system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  #stage canvas { max-width: 100vw; max-height: 100vh; aspect-ratio: 16 / 9; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; align-items: center; padding: 10px 16px; background: linear-gradient(transparent, rgba(0,0,0,.7)); }
  #ui button { background: #e8326e; color: #fff; border: 0; border-radius: 6px; padding: 8px 14px; font: inherit; cursor: pointer; }
  #ui input { flex: 1; }
  body.render #ui { display: none; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="ui"><button id="play">Play</button><input id="seek" type="range" min="0" max="1000" value="0"><span id="time">0:00</span>
<audio id="audio" src="./assets/flower/cover.mp3" preload="auto"></audio></div>
<script type="module">
import { createFlowerMV } from "./src/flower/main.js";
const params = new URLSearchParams(location.search);
const renderMode = params.has("render");
if (renderMode) document.body.classList.add("render");
// the M PLUS Rounded faces load lazily: touch them once so document.fonts.ready waits for them
for (const w of [500, 700, 800]) document.fonts.load(`${w} 20px 'M PLUS Rounded 1c'`);
const mv = await createFlowerMV({ container: document.getElementById("stage") });
window.MV = mv;
mv.renderFrame(0);
if (!renderMode) {
  const audio = document.getElementById("audio"), play = document.getElementById("play"), seek = document.getElementById("seek"), time = document.getElementById("time");
  play.onclick = () => (audio.paused ? audio.play() : audio.pause());
  seek.oninput = () => { audio.currentTime = (seek.value / 1000) * mv.duration; };
  let last = -1;
  const loop = () => {
    const f = Math.min(mv.frames - 1, Math.floor(audio.currentTime * mv.fps));
    if (f !== last) { mv.renderFrame(f); last = f; }
    const s = Math.floor(audio.currentTime); time.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    requestAnimationFrame(loop);
  };
  loop();
}
window.MV_READY = true;
</script>
</body>
</html>
